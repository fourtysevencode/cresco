[project]
name = "cresco-backend"
version = "0.1.0"
description = "Cresco API: NFC student wallet + multilingual AI tutor, quizzes and leaderboard"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.8.0",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "edge-tts>=7.2.8",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
google-tts = ["google-cloud-texttospeech>=2.16"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app.main:app"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cresco
      POSTGRES_PASSWORD: cresco
      POSTGRES_DB: cresco
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cresco"]
      interval: 2s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cresco:cresco@db:5432/cresco
      STORAGE_DIR: /data
    volumes:
      - uploads:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
